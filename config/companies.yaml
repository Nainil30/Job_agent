# =============================================================================
# Job sources — three ingestion tiers, cheapest & most reliable first.
#
#   Tier 1  "api"        Direct JSON / embedded-JSON from the company ATS (fast, structured)
#   Tier 2  "browser"    Headless Chromium for JS-only career sites (Playwright)
#   Tier 3  "aggregator" LinkedIn / Indeed via JobSpy — safety net for sites that
#                        block automation (e.g. Tesla) or have no usable endpoint
#
# Every source reports health (ok / empty / error) on each run, so a site that
# silently breaks shows up in the digest instead of just "finding nothing".
#
# Supported `source` values:
#   workday | eightfold | jibe | amazon | apple | google |
#   greenhouse | lever | ashby | browser
# Run `python -m src.main doctor` to test every source without saving anything.
# =============================================================================

defaults:
  max_results_per_query: 60

companies:
  # ---------------------------------------------------------------- Primary
  - name: Nvidia
    tier: Primary
    source: workday
    url: https://nvidia.wd5.myworkdayjobs.com/wday/cxs/nvidia/NVIDIAExternalCareerSite/jobs
    site_url: https://nvidia.wd5.myworkdayjobs.com/en-US/NVIDIAExternalCareerSite
    queries: ["Hardware Technical Program Manager", "Supply Chain", "NPI", "Operations Program Manager"]

  - name: Amazon
    tier: Primary
    source: amazon
    url: https://www.amazon.jobs/en/search.json
    location: "Austin, TX"           # sent to the API as loc_query
    queries: ["NPI Program Manager", "Supply Chain Program Manager", "Hardware Technical Program Manager", "AWS Infrastructure Supply Chain"]

  - name: Apple
    tier: Primary
    source: apple
    location: united-states-USA
    queries: ["NPI Program Manager", "Materials Program Manager", "Supply Chain Operations", "Operations Program Manager"]

  - name: Google
    tier: Primary
    source: google
    location: United States
    queries: ["NPI Operations", "Supply Chain Program Manager", "Hardware Technical Program Manager", "Materials Planning"]

  - name: Meta
    tier: Primary
    source: browser                  # JS-rendered site with no public JSON endpoint
    url: "https://www.metacareers.com/jobs?q={query}"
    link_selector: "a[href*='/profile/job_details/']"
    link_base: https://www.metacareers.com
    queries: ["supply chain", "hardware program manager", "NPI"]

  - name: Microsoft
    tier: Primary
    source: eightfold
    url: https://apply.careers.microsoft.com
    domain: microsoft.com
    location: United States
    queries: ["supply chain program manager", "hardware program manager", "datacenter supply"]

  # -------------------------------------------------------------- Secondary
  - name: AMD
    tier: Secondary
    source: jibe
    url: https://careers.amd.com
    queries: ["supply chain", "program manager", "NPI"]

  - name: Qualcomm
    tier: Secondary
    source: eightfold
    url: https://careers.qualcomm.com
    domain: qualcomm.com
    location: United States
    queries: ["supply chain", "program manager", "NPI"]

  - name: Applied Materials
    tier: Secondary
    source: workday
    url: https://amat.wd1.myworkdayjobs.com/wday/cxs/amat/External/jobs
    site_url: https://amat.wd1.myworkdayjobs.com/en-US/External
    queries: ["Supply Chain Program Manager", "Materials", "NPI"]

  - name: Intel
    tier: Secondary
    source: workday
    url: https://intel.wd1.myworkdayjobs.com/wday/cxs/intel/External/jobs
    site_url: https://intel.wd1.myworkdayjobs.com/en-US/External
    queries: ["Supply Chain", "Program Manager", "NPI"]

  - name: Samsung Semiconductor
    tier: Secondary
    source: workday
    url: https://sec.wd3.myworkdayjobs.com/wday/cxs/sec/Samsung_Careers/jobs
    site_url: https://sec.wd3.myworkdayjobs.com/en-US/Samsung_Careers
    queries: ["Supply Chain", "Program Manager"]

  - name: Micron
    tier: Secondary
    source: workday
    url: https://micron.wd1.myworkdayjobs.com/wday/cxs/micron/External/jobs
    site_url: https://micron.wd1.myworkdayjobs.com/en-US/External
    queries: ["Supply Chain", "NPI", "Program Manager"]

  - name: Cisco
    tier: Secondary
    source: workday
    url: https://cisco.wd5.myworkdayjobs.com/wday/cxs/cisco/Cisco_Careers/jobs
    site_url: https://cisco.wd5.myworkdayjobs.com/en-US/Cisco_Careers
    queries: ["Supply Chain", "NPI", "Hardware Program Manager"]

  - name: HPE
    tier: Secondary
    source: workday
    url: https://hpe.wd5.myworkdayjobs.com/wday/cxs/hpe/Jobsathpe/jobs
    site_url: https://hpe.wd5.myworkdayjobs.com/en-US/Jobsathpe
    queries: ["Supply Chain", "NPI", "Program Manager"]

  - name: Broadcom
    tier: Secondary
    source: workday
    url: https://broadcom.wd1.myworkdayjobs.com/wday/cxs/broadcom/External_Career/jobs
    site_url: https://broadcom.wd1.myworkdayjobs.com/en-US/External_Career
    queries: ["Supply Chain", "Operations"]

  - name: NXP
    tier: Secondary
    source: workday
    url: https://nxp.wd3.myworkdayjobs.com/wday/cxs/nxp/careers/jobs
    site_url: https://nxp.wd3.myworkdayjobs.com/en-US/careers
    queries: ["Supply Chain", "Program Manager"]

  # --------------------------------------------- Hardware startups (public ATS boards)
  # Greenhouse / Lever / Ashby boards return every open role in one call;
  # the title + location filters do the narrowing.
  - {name: Anduril,     tier: Startup, source: greenhouse, board: andurilindustries}
  - {name: SpaceX,      tier: Startup, source: greenhouse, board: spacex}
  - {name: Tenstorrent, tier: Startup, source: greenhouse, board: tenstorrent}
  - {name: Lightmatter, tier: Startup, source: greenhouse, board: lightmatter}
  - {name: Astranis,    tier: Startup, source: greenhouse, board: astranis}
  - {name: Figure AI,   tier: Startup, source: greenhouse, board: figure}
  - {name: Shield AI,   tier: Startup, source: lever,      board: shieldai}
  - {name: Zoox,        tier: Startup, source: lever,      board: zoox}
  - {name: Etched,      tier: Startup, source: ashby,      board: etched}
  - {name: Crusoe,      tier: Startup, source: ashby,      board: crusoe}
  - {name: Lambda,      tier: Startup, source: ashby,      board: lambda}
  - {name: Saronic,     tier: Startup, source: ashby,      board: saronic}

# =============================================================================
# Tier 3 — aggregator safety net (python-jobspy, free, no keys).
# Use it for companies whose own site blocks bots (Tesla) or has no endpoint
# (Dell, Oracle …), plus broad role searches that catch companies you haven't
# listed above. `companies:` keeps only postings from those employers.
# =============================================================================
aggregators:
  jobspy:
    enabled: true
    sites: [indeed, linkedin]
    hours_old: 72
    results_wanted: 30
    searches:
      # Company-specific searches look back two weeks (these employers post less often)
      - {term: "Tesla supply chain",          location: "Austin, TX",     companies: [Tesla], hours_old: 336}
      - {term: "Tesla program manager",       location: "Austin, TX",     companies: [Tesla], hours_old: 336}
      - {term: "Dell supply chain",           location: "Round Rock, TX", companies: [Dell, Dell Technologies], hours_old: 336}
      - {term: "Oracle hardware supply chain", location: "Austin, TX",    companies: [Oracle], hours_old: 336}
      # Broad role searches catch employers not listed above
      - {term: "NPI program manager",                location: "Austin, TX"}
      - {term: "materials program manager",          location: "United States"}
      - {term: "hardware technical program manager datacenter", location: "United States"}
