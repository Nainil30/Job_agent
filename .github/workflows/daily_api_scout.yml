name: Daily Autonomous Job Hunter

on:
  schedule:
    - cron: '0 12 * * *'  # Runs daily at 12:00 UTC (7:00 AM CDT)
  workflow_dispatch:      # Allows manual trigger in GitHub UI

permissions:
  contents: write

jobs:
  scout-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: pytest

      - name: Execute Daily Ingestion & Evaluation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/main.py --mode api

      - name: Commit & Push Daily Ledger & Digest
        run: |
          git config --global user.name "JobScout Autonomous Agent"
          git config --global user.email "jobscout-bot@users.noreply.github.com"
          git add data/ digests/
          git diff --staged --quiet || (git commit -m "chore(digest): update daily job opportunities [skip ci]" && git push)